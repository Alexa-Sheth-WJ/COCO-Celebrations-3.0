<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COCO Celebrations</title>
<style>
:root{
  --navy:#193157; --brand-green:#5DA836; --brand-purple:#664593;
  --bg:#0D1829; --bg-2:#13223B; --surface:#172A4A; --surface-2:#1E355C; --line:rgba(255,255,255,.09);
  --text:#F2F5FA; --muted:#A3B0C6; --green-ink:#86D15C;
  --week:#B596F0; --week-fill:rgba(155,122,214,.2); --grey:#8391A8; --grey-fill:rgba(125,138,161,.16);
  --gold-ink:#F7CD6A; --focus:#9FD97E; --tint:22%;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#EEF1F6; --bg-2:#E4E9F2; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:rgba(19,34,61,.1);
    --text:#13223D; --muted:#5A6781; --green-ink:#3E7F1F;
    --week:#664593; --week-fill:rgba(102,69,147,.12); --grey:#6E7B91; --grey-fill:rgba(110,123,145,.12);
    --gold-ink:#8A5F00; --focus:#3E7F1F; --tint:14%;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.frame{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 100% 0%,rgba(93,168,54,.10),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(102,69,147,.12),transparent 60%),var(--bg);
  container-type:size;container-name:frame}
.frame.fixed{height:auto;width:min(100vw, calc(100vh * var(--ar)));width:min(100vw, calc(100dvh * var(--ar)));
  max-height:100vh;max-height:100dvh;top:50%;transform:translateY(-50%)}

/* Brand band */
.brand{flex:none;display:flex;align-items:center;gap:12px;background:var(--navy);padding:8px 14px;position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,#5DA836 0 20%,#F2A900 20% 40%,#E8336D 40% 60%,#664593 60% 80%,#2F80ED 80%)}
.brand img{display:block;height:clamp(22px,9cqh,44px);width:auto;max-width:56%;object-fit:contain}
.brand .titles{margin-left:auto;text-align:right;min-width:0}
.brand h1{margin:0;font-size:clamp(13px,4cqw,18px);font-weight:800;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.brand .month{display:block;font-size:12px;font-weight:600;color:#8ED163;margin-top:1px;white-space:nowrap}
.brand .mini{display:none}

/* Hero card */
.hero{flex:none;margin:12px 14px 8px;border-radius:16px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(118deg,#5DA836 0%,#1E8C6E 42%,#193157 100%);box-shadow:0 8px 22px rgba(25,49,87,.28)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:radial-gradient(circle at 78% 22%,#F2A900 0 3px,transparent 4px),radial-gradient(circle at 90% 70%,#E8336D 0 3px,transparent 4px),
  radial-gradient(circle at 64% 82%,#fff 0 2px,transparent 3px),radial-gradient(circle at 96% 38%,#9FD97E 0 2.5px,transparent 3.5px),
  radial-gradient(circle at 70% 50%,#B596F0 0 2px,transparent 3px)}
.count{position:relative;display:flex;align-items:center;gap:12px}
.count .n{font-size:clamp(34px,12cqh,56px);font-weight:900;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.count .lbl{font-size:13px;line-height:1.3;color:rgba(255,255,255,.85)}
.count .lbl b{display:block;color:#fff;font-weight:700;font-size:14px}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0;padding:0;list-style:none}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 9px;min-width:0}
.stat .v{font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;line-height:1.25;color:rgba(255,255,255,.8);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.gold .v{color:#FFE07A}

/* Team filter */
.teams{flex:none;display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.teams::after{content:"";flex:none;width:14px}
.teams::-webkit-scrollbar{display:none}
.team-chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;cursor:pointer;white-space:nowrap}
.team-chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.team-chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.team-chip[aria-pressed="true"] i{background:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Search */
.search{flex:none;position:relative;padding:0 14px 10px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 74px 9px 36px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search svg{position:absolute;left:26px;top:50%;margin-top:-12px;width:16px;height:16px;color:var(--brand-green)}
.search .hits{position:absolute;right:26px;top:50%;margin-top:-13px;font-size:12px;color:var(--muted);pointer-events:none}

/* Body */
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 14px;-webkit-overflow-scrolling:touch;position:relative}
.sec h3{margin:4px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec + .sec{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;border-radius:16px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
  background:linear-gradient(165deg,color-mix(in srgb,var(--c) var(--tint),var(--surface)) 0%,var(--surface) 75%);
  box-shadow:0 2px 0 color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 28%,transparent)}
.tile img{width:clamp(54px,15cqmin,92px);height:clamp(54px,15cqmin,92px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.22));transition:transform .2s ease}
.tile:hover img{transform:rotate(-4deg) scale(1.05)}
.tile .tl{font-size:12.5px;font-weight:800;line-height:1.2;text-align:center}
.tile .ts{font-size:11px;font-weight:600;color:var(--muted)}
.tile .cnt{position:absolute;top:7px;right:7px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--c);color:#fff;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tile.zero{opacity:.55}
.tile.zero .cnt{background:var(--grey)}
.tile .today{position:absolute;top:9px;left:9px;width:10px;height:10px;border-radius:50%;background:#E8336D;box-shadow:0 0 0 3px rgba(232,51,109,.25);animation:pulse 1.5s ease-in-out infinite}

/* Detail */
.dhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:6px;border-radius:16px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,var(--surface)) 0%,var(--surface) 80%);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.dhead img{flex:none;width:clamp(48px,13cqmin,84px);height:clamp(48px,13cqmin,84px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.dhead h2{margin:0;font-size:clamp(15px,3.6cqmin,22px);font-weight:800;letter-spacing:-.01em;line-height:1.2}
.dhead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dhead .back{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--text)}
.dhead .txt{min-width:0}
.list{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.when{flex:none;width:44px;border-radius:10px;text-align:center;padding:4px 0 5px;background:color-mix(in srgb,var(--c,#7D8AA1) 20%,transparent);color:var(--c-ink,var(--text))}
.when .mo{display:block;font-size:10px;font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.when .d{display:block;font-size:18px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.row.past .when{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.row.past .who,.row.past .what{opacity:.7}
.who{flex:1 1 auto;min-width:0}
.nmrow{display:flex;align-items:center;gap:5px;min-width:0}
.nm{font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nmrow img{flex:none;width:18px;height:18px}
.team{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;
  background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t-ink)}
.team::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--t)}
.what{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.yrs{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .bx{flex:none;width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.up{background:var(--grey-fill);color:var(--grey)}
.chip.up.week{background:var(--week-fill);color:var(--week)}
.chip.today{background:linear-gradient(90deg,#E8336D,#664593);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.5s ease-in-out infinite}
.empty{padding:20px 6px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes pop{0%{transform:scale(.6) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* Confetti */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;opacity:0;animation:fall 2.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

/* Width tiers */
@container frame (max-width: 339px){
  .stats{grid-template-columns:1fr;gap:5px}
  .stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 9px}
  .stat .k{order:-1;margin:0}
}
@container frame (max-width: 400px){
  .stats{gap:6px} .stat{padding:5px 7px} .stat .v{font-size:13px} .stat .k{font-size:10.5px}
  .brand .month{font-size:11px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{padding:10px 4px 8px}
}
@container frame (max-width: 300px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{gap:7px} .row .chip{display:none} .when{width:38px}
}
@container frame (min-width: 700px){
  .brand{padding:10px 20px}
  .hero{margin:14px 20px 10px;display:flex;align-items:center;gap:18px;padding:14px 18px}
  .hero .stats{flex:1;margin:0;max-width:720px;margin-left:auto}
  .teams,.search{padding-left:20px;padding-right:20px}
  .teams{-webkit-mask-image:none;mask-image:none}
  .search input{max-width:520px}
  .body{padding:0 20px 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:28px}
  .row:last-child{border-bottom:1px solid var(--line)}
}
@container frame (min-width: 1100px) and (min-height: 600px){
  .brand img{height:clamp(40px,7cqh,64px)} .brand h1{font-size:26px} .brand .month{font-size:15px}
  .count .n{font-size:clamp(56px,10cqh,90px)} .count .lbl{font-size:16px} .count .lbl b{font-size:18px}
  .stat{padding:10px 14px} .stat .v{font-size:20px} .stat .k{font-size:13px}
  .team-chip{font-size:15px;padding:8px 16px 8px 12px} .search input{font-size:16px;padding:11px 74px 11px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))} .tile .tl{font-size:15px} .tile .ts{font-size:13px}
  .tile img{width:clamp(80px,13cqmin,130px);height:clamp(80px,13cqmin,130px)}
  .list{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .nm{font-size:16px} .team{font-size:12.5px} .yrs{font-size:15px} .chip{font-size:12px}
  .when{width:56px} .when .d{font-size:23px} .when .mo{font-size:11px} .row .bx{width:42px;height:42px}
  .sec h3{font-size:14px} .dhead h2{font-size:26px} .dhead p{font-size:14px}
}
@container frame (max-width: 230px){
  .what,.row .bx,.nmrow img{display:none} .when{width:34px} .dhead{gap:8px;padding:8px} .dhead img{display:none} .team{display:block}
  .grid{grid-template-columns:1fr}
}
/* Height tiers: shed blocks so nothing overflows */
@container frame (max-height: 470px){ .stats{display:none} .hero{padding:10px 14px} }
@container frame (max-width: 339px) and (max-height: 600px){ .stats{display:none} }
@container frame (max-height: 340px){ .hero{display:none} .brand .month{display:none} .brand .mini{display:block} .teams{padding-top:10px} }
@container frame (max-height: 210px){ .search{display:none} }
@media (prefers-reduced-motion: reduce){
  .dot,.tile .today,.dhead img{animation:none}
  .tile,.tile img{transition:none}
  .confetti{display:none}
}
</style>
</head>

const BADGE_DEF = {
  y1:     { name: '1 Year of Service', short: '1 Year', c: '#2F6FED' },
  y2:     { name: '2 Years of Service', short: '2 Years', c: '#00A3E0' },
  y5:     { name: '5 Years of Service', short: '5 Years', c: '#E8336D' },

  care:   { name: 'Care for Others', short: 'Care for Others', c: '#2E8B9A' },
  safety: { name: '#1 in Safety', short: '#1 in Safety', c: '#CA1C2C' },
  super:  { name: 'WorkJam Wednesday Super User', short: 'Super User', c: '#6A3FC4' },
};
const ANNIV_KEYS = ['y1', 'y2', 'y5', 'y10', 'y20', 'road'];
const HONOR_KEYS = ['legacy', 'care', 'safety', 'super'];
const AWARD_CODES = { c: 'care', s: 'safety', u: 'super' };
const AWARD_ORDER = ['care', 'safety', 'super'];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const DAY = 864e5;
const isDark = () => !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);

const people = [];
for (const role of DATA.roles) {
  const raw = DATA.r[role.key]; if (!raw) continue;
  for (const rec of raw.split(';')) {
    const [n, d36, m36, , aw] = rec.split('|');
    const dt = new Date(parseInt(d36, 36) * DAY);
    const mgr = DATA.m[parseInt(m36, 36)] || '';
    const awards = (aw || '').split('').map(c => AWARD_CODES[c]).filter(Boolean).sort((a, b) => AWARD_ORDER.indexOf(a) - AWARD_ORDER.indexOf(b));
    people.push({ name: n, role: role.key, hy: dt.getUTCFullYear(), hm: dt.getUTCMonth(), hd: dt.getUTCDate(), mgr, awards,
      id: n + '|' + d36,
      key: [n, mgr, TEAMS[role.key].label, ...awards.map(a => BADGE_DEF[a].name)].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() });
  }
}
// one entry per person when looking across all teams (a few people hold two roles)
const uniquePeople = (() => { const m = new Map(); for (const p of people) if (!m.has(p.id)) m.set(p.id, p); return [...m.values()]; })();

/* ---- Date helpers (ordinal day numbers, local calendar) ---- */
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const ord = (y, m, d) => Math.round(Date.UTC(y, m, d) / DAY);
const anniv = (p, y) => ord(y, p.hm, (p.hm === 1 && p.hd === 29 && !isLeap(y)) ? 28 : p.hd);
const fromOrd = o => { const t = new Date(o * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const MILESTONES = [1, 2, 5, 10, 20, 25];
const badgeForYears = n => n >= 25 ? 'legacy' : ([1, 2, 5, 10, 20].includes(n) ? 'y' + n : 'road');

let T = null;
function computeToday() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate(), o = ord(y, m, d), dow = now.getDay();
  T = { y, m, d, o, wkStart: o - dow, wkEnd: o - dow + 6, key: y + '-' + m + '-' + d };
}
function nextAnniv(p) {
  let y = T.y, a = anniv(p, y);
  if (a < T.o) { y++; a = anniv(p, y); }
  if (y - p.hy < 1) { y = p.hy + 1; a = anniv(p, y); }
  return { o: a, yrs: y - p.hy };
}
function nextMilestone(p) {
  let n = nextAnniv(p).yrs;
  while (!MILESTONES.includes(n) && n < 25) n++;
  return MILESTONES.includes(n) ? { o: anniv(p, p.hy + n), yrs: n } : null;
}
const completedYears = p => anniv(p, T.y) <= T.o ? T.y - p.hy : T.y - p.hy - 1;
const inWeek = p => [T.y - 1, T.y, T.y + 1].some(y => { const a = anniv(p, y); return a >= T.wkStart && a <= T.wkEnd && y - p.hy >= 1; });

/* ---- State ---- */
const $ = id => document.getElementById(id);
let team = 'all', view = 'gallery', query = '';
const celebrated = new Set();
const groupFor = () => team === 'all' ? uniquePeople : people.filter(p => p.role === team);
const teamName = () => team === 'all' ? 'All teams' : TEAMS[team].label;

function buckets(group) {
  const b = Object.fromEntries([...ANNIV_KEYS, ...HONOR_KEYS].map(k => [k, []]));
  for (const p of group) {
    const yrs = T.y - p.hy;
    if (p.hm === T.m && yrs >= 1) {
      const k = badgeForYears(yrs);
      if (k !== 'legacy') b[k].push(p);
    }
    if (completedYears(p) >= 25 || (p.hm === T.m && yrs >= 25)) b.legacy.push(p);
    for (const a of p.awards) b[a].push(p);
  }
  return b;
}

/* ---- Pieces ---- */
function teamTag(p) {
  const t = TEAMS[p.role];
  return `<span class="team" style="--t:${t.c};--t-ink:${isDark() ? t.ink[0] : t.ink[1]}">${esc(t.label)}</span>`;
}
const awardIcons = p => p.awards.map(a => `<img src="${BADGES[a]}" alt="${esc(BADGE_DEF[a].name)}" title="${esc(BADGE_DEF[a].name)}">`).join('');

function rowHTML(p, o, yrs, color, opts = {}) {
  const dt = fromOrd(o);
  const thisMonth = dt.m === T.m && dt.y === T.y;
  const today = o === T.o, past = thisMonth && o < T.o, week = o >= T.wkStart && o <= T.wkEnd;
  let chip = '';
  if (today) chip = `<span class="chip today"><span class="dot"></span>Happy Anniversary!</span>`;
  else if ((thisMonth || opts.search) && !past) chip = `<span class="chip up${week ? ' week' : ''}">Coming Up</span>`;
  const ink = color;
  return `<li class="row${past && !opts.search ? ' past' : ''}">
    <div class="when" style="--c:${color};--c-ink:${isDark() ? '#fff' : ink}" aria-label="${MONTHS[dt.m]} ${dt.d}"><span class="mo">${MON3[dt.m]}</span><span class="d">${dt.d}</span></div>
    <div class="who"><div class="nmrow"><span class="nm">${esc(p.name)}</span>${awardIcons(p)}</div>${teamTag(p)}</div>
    <div class="what"><span class="yrs">${plural(yrs, 'yr')}</span>${chip}</div>
    ${opts.badge ? `<img class="bx" src="${BADGES[opts.badge]}" alt="${esc(BADGE_DEF[opts.badge].name)}">` : ''}
  </li>`;
}

/* ---- Hero ---- */
function renderHero(group) {
  const inMonth = group.filter(p => p.hm === T.m && T.y - p.hy >= 1);
  const word = inMonth.length === 1 ? 'anniversary' : 'anniversaries';
  $('heroN').textContent = inMonth.length;
  $('heroL').innerHTML = `<b>${esc(teamName())}</b>${word} in ${MONTHS[T.m]}`;
  $('mini').textContent = `${inMonth.length} ${word} in ${MON3[T.m]}`;
  let best = null;
  for (const p of group) { const m = nextMilestone(p); if (m && (!best || m.o < best.o)) best = { ...m, p }; }
  if (best) {
    $('sMs').textContent = best.o === T.o ? 'Today' : 'In ' + plural(best.o - T.o, 'day');
    $('sMsK').textContent = `${best.p.name.split(' ')[0]}, ${plural(best.yrs, 'yr')}`;
    $('sMsK').title = `Next milestone: ${best.p.name}, ${best.yrs} years`;
  } else { $('sMs').textContent = '–'; $('sMsK').textContent = 'Next milestone'; }
  $('sWk').textContent = group.filter(inWeek).length;
  let lt = null, ly = -1;
  for (const p of group) { const c = completedYears(p); if (c > ly) { ly = c; lt = p; } }
  $('sLt').textContent = lt ? plural(ly, 'yr') : '–';
  $('sLtK').textContent = lt ? lt.name : 'Longest tenured';
}

/* ---- Views ---- */
function tileHTML(k, list) {
  const d = BADGE_DEF[k], n = list.length;
  const sub = ANNIV_KEYS.includes(k) ? 'celebrating' : (k === 'legacy' ? (n === 1 ? 'member' : 'members') : (n ? 'recognized' : 'none yet'));
  const hasToday = list.some(p => p.hm === T.m && anniv(p, T.y) === T.o && T.y - p.hy >= 1);
  return `<button class="tile${n ? '' : ' zero'}" data-k="${k}" style="--c:${d.c}" aria-label="${esc(d.name)}, ${n} ${sub}">
    ${hasToday ? '<span class="today" title="Anniversary today"></span>' : ''}<span class="cnt">${n}</span>
    <img src="${BADGES[k]}" alt=""><span class="tl">${esc(d.short)}</span><span class="ts">${sub}</span></button>`;
}

function renderGallery(b) {
  $('body').innerHTML = `
    <section class="sec"><h3>${MONTHS[T.m]} anniversaries</h3><div class="grid">${ANNIV_KEYS.map(k => tileHTML(k, b[k])).join('')}</div></section>
    <section class="sec"><h3>Honors</h3><div class="grid">${HONOR_KEYS.map(k => tileHTML(k, b[k])).join('')}</div></section>`;
}

function renderDetail(k, b) {
  const d = BADGE_DEF[k];
  let rows = [], sub = '', empty = '';
  if (ANNIV_KEYS.includes(k)) {
    rows = b[k].map(p => ({ p, o: anniv(p, T.y), yrs: T.y - p.hy })).sort((a, c) => a.o - c.o || c.yrs - a.yrs || a.p.name.localeCompare(c.p.name));
    sub = `${rows.length} celebrating in ${MONTHS[T.m]}`;
    empty = `<b>No ${esc(d.short)} anniversaries in ${MONTHS[T.m]}</b>Check back next month.`;
  } else if (k === 'legacy') {
    rows = b.legacy.map(p => {
      const cm = p.hm === T.m;
      return { p, o: anniv(p, T.y), yrs: cm ? T.y - p.hy : completedYears(p), cm };
    }).sort((a, c) => (c.cm - a.cm) || (a.cm ? a.o - c.o : c.yrs - a.yrs) || a.p.name.localeCompare(c.p.name));
    const cm = rows.filter(r => r.cm).length;
    sub = `${plural(rows.length, 'member')} with 25+ years` + (cm ? `, ${cm} celebrating in ${MONTHS[T.m]}` : '');
    empty = `<b>No Legacy members yet</b>Team members join COCO Legacy at 25 years of service.`;
  } else {
    rows = b[k].map(p => ({ p, o: anniv(p, T.y), yrs: Math.max(completedYears(p), 0) })).sort((a, c) => a.p.name.localeCompare(c.p.name));
    sub = `${rows.length} recognized`;
    empty = `<b>No one has earned this badge yet</b>When a team member earns ${esc(d.name)}, they’ll be celebrated here.`;
  }
  $('body').innerHTML = `
    <div class="dhead" style="--c:${d.c}">
      <button class="back" id="back" aria-label="Back to all badges">‹</button>
      <img src="${BADGES[k]}" alt="">
      <div class="txt"><h2>${esc(d.name)}</h2><p>${esc(sub)}, ${esc(teamName())}</p></div>
    </div>
    <ul class="list">${rows.length ? rows.map(r => rowHTML(r.p, r.o, r.yrs, d.c)).join('') : `<li class="empty">${empty}</li>`}</ul>`;
  const body = $('body'); body.scrollTop = 0;
  if (ANNIV_KEYS.includes(k) || k === 'legacy') {
    const i = rows.findIndex(r => (k !== 'legacy' || r.cm) && r.o >= T.o);
    const hasPast = rows.some(r => (k !== 'legacy' || r.cm) && r.o < T.o);
    if (i > 0 && hasPast) { const li = body.querySelectorAll('.row')[i]; body.scrollTop = li.offsetTop - body.querySelector('.dhead').offsetHeight - 8; }
  }
  if (rows.some(r => r.o === T.o && (ANNIV_KEYS.includes(k) || r.cm))) celebrate('d' + k);
}

function renderSearch() {
  const q = query.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const pool = team === 'all' ? uniquePeople : people.filter(p => p.role === team);
  const hits = pool.filter(p => p.key.includes(q)).map(p => ({ p, nx: nextAnniv(p) }))
    .sort((a, b) => a.nx.o - b.nx.o || a.p.name.localeCompare(b.p.name));
  $('hits').textContent = plural(hits.length, 'match').replace('matchs', 'matches');
  $('body').innerHTML = hits.length
    ? `<ul class="list">${hits.slice(0, 100).map(({ p, nx }) => { const k = badgeForYears(nx.yrs); return rowHTML(p, nx.o, nx.yrs, BADGE_DEF[k].c, { badge: k, search: true }); }).join('')}</ul>`
      + (hits.length > 100 ? `<p class="empty">Showing the first 100. Add more of the name to narrow it down.</p>` : '')
    : `<p class="empty"><b>No one matches “${esc(query)}”</b>Check the spelling, or try a first or last name only.</p>`;
  $('body').scrollTop = 0;
}

function render() {
  if (!T) computeToday();
  $('month').textContent = `${MONTHS[T.m]} ${T.y}`;
  document.querySelectorAll('.team-chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === team));
  const group = groupFor();
  renderHero(group);
  if (query.length >= 2) { renderSearch(); return; }
  $('hits').textContent = '';
  const b = buckets(group);
  if (view === 'gallery') {
    renderGallery(b);
    if (group.some(p => p.hm === T.m && anniv(p, T.y) === T.o && T.y - p.hy >= 1)) celebrate('g');
  } else renderDetail(view, b);
}

function celebrate(tag) {
  const k = team + tag + T.key;
  if (celebrated.has(k)) return; celebrated.add(k); confetti();
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#5DA836', '#664593', '#F2BE45', '#CA1C2C', '#2F80ED', '#E8336D', '#FFFFFF'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('i');
    s.style.left = (6 + (i * 41) % 88) + '%';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', ((i * 37) % 80 - 40) + 'px');
    s.style.setProperty('--dy', (180 + (i * 53) % 160) + 'px');
    s.style.setProperty('--r', ((i * 97) % 540 - 270) + 'deg');
    s.style.animationDelay = ((i * 7) % 10) * 0.06 + 's';
    box.appendChild(s);
  }
  $('frame').appendChild(box);
  setTimeout(() => box.remove(), 3400);
}

/* ---- Wiring ---- */
$('teams').innerHTML = [['all', 'All teams', '#193157'], ...Object.entries(TEAMS).map(([k, t]) => [k, t.label, t.c])]
  .map(([k, l, c]) => `<button class="team-chip" data-t="${k}" style="--c:${k === 'all' ? 'var(--brand-green)' : c}" aria-pressed="${k === team}"><i></i>${esc(l)}</button>`).join('');
$('teams').addEventListener('click', e => { const b = e.target.closest('.team-chip'); if (!b) return; team = b.dataset.t; render(); });
$('body').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (t) { view = t.dataset.k; render(); $('back') && $('back').focus({ preventScroll: true }); return; }
  if (e.target.closest('#back')) { view = 'gallery'; render(); const tile = document.querySelector('.tile'); tile && tile.focus({ preventScroll: true }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && view !== 'gallery' && query.length < 2) { view = 'gallery'; render(); } });
let qTimer = 0;
$('q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value.trim(); if (query.length < 2) view = view; render(); }, 120); });
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: light)'); mq.addEventListener && mq.addEventListener('change', render); }

/* Tick every second; re-render when the calendar day rolls over */
setInterval(() => { const n = new Date(), k = n.getFullYear() + '-' + n.getMonth() + '-' + n.getDate(); if (T && k !== T.key) { computeToday(); render(); } }, 1000);

computeToday();
render();
</script>
</body>
</html>
